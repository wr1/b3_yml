[project]
name = "b3-yml"
version = "0.1.0"
description = "YAML datasets (blade configs, airfoils, polars) for b3m"
authors = [
  { name = "wr1", email = "8971152+wr1@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
  "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b3_yml"]

[tool.hatch.build]
sources = ["src"]   # critical for src-layout editable installs

[tool.pytest.ini_options]
addopts = "--cov=b3_yml --cov-report=term-missing -q -p no:logfire"
python_files = ["test_*.py"]
pythonpath = ["src"]   # fixes ModuleNotFoundError in tests/ for src-layout
